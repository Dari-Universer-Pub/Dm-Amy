<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// Effets activables (comparaison avant/après) : ?off=ao,reflect,embers,fog,flameshadow ou ?off=all
const OFF = new URLSearchParams(location.search).get('off') || '';
const on = (k) => !OFF.includes('all') && !OFF.split(',').includes(k);

/* ============================================================
   1. Bruit procédural tuilable (aucune texture téléchargée)
   ============================================================ */
function hash2(x, y, s) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
// Bruit de valeur périodique : px, py = nombre de cellules par tuile (pas de couture)
function vnoise(x, y, px, py, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const x0 = ((xi % px) + px) % px, y0 = ((yi % py) + py) % py;
  const x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
  const a = hash2(x0, y0, s), b = hash2(x1, y0, s), c = hash2(x0, y1, s), d = hash2(x1, y1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// fbm sur [0,1]² ; Fx, Fy = cellules par tuile à l'octave de base
function fbm(u, v, Fx, Fy, oct, s) {
  let sum = 0, amp = 0.5, norm = 0, fx = Fx, fy = Fy;
  for (let i = 0; i < oct; i++) {
    sum += amp * vnoise(u * fx, v * fy, fx, fy, s + i * 31);
    norm += amp; amp *= 0.5; fx *= 2; fy *= 2;
  }
  return sum / norm;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const C = (hex) => [(hex >> 16) & 255, (hex >> 8) & 255, hex & 255];
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const scale3 = (c, k) => [c[0] * k, c[1] * k, c[2] * k];

// Texture de hauteur -> normal map (tangente, convention OpenGL)
function heightGrid(S, fn) {
  const h = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) h[y * S + x] = fn(x / S, y / S);
  return h;
}
function normalPixels(h, S, k) {
  const out = new Uint8ClampedArray(S * S * 4);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = (h[y * S + (x + 1) % S] - h[y * S + (x - 1 + S) % S]) * k;
    const dy = (h[((y + 1) % S) * S + x] - h[((y - 1 + S) % S) * S + x]) * k;
    const il = 1 / Math.hypot(dx, dy, 1);
    const o = (y * S + x) * 4;
    out[o] = (-dx * il * 0.5 + 0.5) * 255;
    out[o + 1] = (dy * il * 0.5 + 0.5) * 255;
    out[o + 2] = (il * 0.5 + 0.5) * 255;
    out[o + 3] = 255;
  }
  return out;
}
function toTexture(data, S, srgb) {
  const c = document.createElement('canvas');
  c.width = c.height = S;
  c.getContext('2d').putImageData(new ImageData(data, S, S), 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
// Jeu complet : couleur (sRGB), rugosité (canal G), normal map
function buildSet(S, { hgt, col, rgh, nStr = 3 }) {
  const h = heightGrid(S, hgt);
  const cd = new Uint8ClampedArray(S * S * 4), rd = new Uint8ClampedArray(S * S * 4);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = y * S + x, o = i * 4, u = x / S, v = y / S;
    const c = col(u, v, h[i]);
    cd[o] = c[0]; cd[o + 1] = c[1]; cd[o + 2] = c[2]; cd[o + 3] = 255;
    const r = Math.max(0, Math.min(1, rgh(u, v, h[i]))) * 255;
    rd[o] = rd[o + 1] = rd[o + 2] = r; rd[o + 3] = 255;
  }
  return {
    map: toTexture(cd, S, true),
    rough: toTexture(rd, S, false),
    nrm: toTexture(normalPixels(h, S, nStr), S, false),
  };
}
function radialTexture(stops) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  stops.forEach(([o, col]) => grd.addColorStop(o, col));
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// Nuage de brume : fbm masqué par un disque
function fogTexture() {
  const S = 256, d = new Uint8ClampedArray(S * S * 4);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S;
    const r = Math.min(1, Math.hypot(u - 0.5, v - 0.5) * 2);
    const a = (1 - r) * (1 - r) * smooth(0.35, 0.7, fbm(u, v, 3, 3, 4, 101));
    const o = (y * S + x) * 4;
    d[o] = d[o + 1] = d[o + 2] = 255;
    d[o + 3] = a * 255;
  }
  return toTexture(d, S, true);
}

/* ============================================================
   2. Textures PBR générées : pierre, cuir, tissu, métal, laiton
   ============================================================ */
const stone = buildSet(512, {
  hgt: (u, v) => 0.6 * fbm(u, v, 12, 12, 4, 1) + 0.4 * Math.pow(1 - Math.abs(2 * fbm(u, v, 6, 6, 3, 9) - 1), 3),
  col: (u, v, h) => {
    const base = lerp3(C(0x2e2a26), C(0x5e564b), h);
    const moss = smooth(0.52, 0.7, fbm(u, v, 3, 3, 3, 21));
    return lerp3(base, C(0x34402c), moss * 0.55);
  },
  // flaques (rugosité basse) et pierre sèche (rugosité haute) : petites taches, pas de cratères
  rgh: (u, v) => 0.8 - 0.42 * smooth(0.42, 0.62, fbm(u, v, 2, 2, 3, 55)),
  nStr: 1.6,
});
const leather = buildSet(512, {
  hgt: (u, v) => 0.6 * fbm(u, v, 24, 24, 3, 7) + 0.4 * fbm(u, v, 6, 6, 2, 70),
  col: (u, v, h) => {
    const worn = smooth(0.6, 0.75, fbm(u, v, 4, 4, 2, 80));
    return lerp3(lerp3(C(0x24150e), C(0x4a2b1b), h), C(0x6e4d36), worn * 0.7);
  },
  rgh: (u, v, h) => 0.5 + 0.35 * (1 - h),
  nStr: 3,
});
const cloth = buildSet(512, {
  hgt: (u, v) => 0.5 + 0.06 * (Math.sin(2 * Math.PI * 64 * u) + Math.sin(2 * Math.PI * 64 * v)) + 0.1 * fbm(u, v, 6, 6, 3, 5),
  col: (u, v, h) => scale3(lerp3(C(0x1b2350), C(0x2d1c52), fbm(u, v, 4, 4, 3, 12)), 0.85 + 0.3 * h),
  rgh: (u, v, h) => 0.78 + 0.12 * h,
  nStr: 2.5,
});
const metal = buildSet(256, {
  // rayures longues et fines dans un sens : métal usé
  hgt: (u, v) => 0.8 * fbm(u, v, 3, 70, 2, 4) + 0.2 * fbm(u, v, 8, 8, 2, 5),
  col: (u, v, h) => lerp3(C(0x8e98a6), C(0xd2d9e4), h),
  rgh: (u, v, h) => 0.22 + 0.2 * h,
  nStr: 0.4,
});
const brass = buildSet(256, {
  hgt: (u, v) => fbm(u, v, 6, 6, 4, 8),
  col: (u, v, h) => lerp3(C(0x7a5a2c), C(0xc8a060), h),
  rgh: (u, v, h) => 0.3 + 0.35 * h,
  nStr: 1,
});

/* ============================================================
   3. Renderer, scène, environnement physique
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;   // sRGB
renderer.toneMapping = THREE.ACESFilmicToneMapping; // ACES
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;   // ombres douces (r160 : lumières physiques par défaut)

const scene = new THREE.Scene();
// Fond uni (un fond-texture fait apparaître un rectangle noir dans le passage AO) ; le dégradé vient du vignettage CSS
scene.background = new THREE.Color(0x0c0a16);
scene.fog = new THREE.FogExp2(0x07060d, 0.05);
// Réflexions : salle procédurale convertie en cubemap PMREM
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);

/* ============================================================
   4. Matériaux (texture × teinte)
   ============================================================ */
function pbr(set, extra = {}) {
  return new THREE.MeshStandardMaterial({
    map: set.map, normalMap: set.nrm, normalScale: new THREE.Vector2(0.8, 0.8),
    roughnessMap: set.rough, roughness: 1, metalness: 0, envMapIntensity: 0.35, ...extra,
  });
}
const M = {
  coat:    pbr(cloth, { color: 0xffffff }),
  coatLo:  pbr(cloth, { color: 0x9aa0c8 }),
  purple:  pbr(cloth, { color: 0xb688e8 }),
  cape:    pbr(cloth, { color: 0x8c5cc4, side: THREE.DoubleSide }),
  scarf:   pbr(cloth, { color: 0xc4482c, side: THREE.DoubleSide }),
  leather: pbr(leather, { color: 0xffffff }),
  dark:    pbr(leather, { color: 0x6c6470 }),
  red:     pbr(leather, { color: 0xc04a2a }),
  grip:    pbr(leather, { color: 0x6a3a2a }),
  cord:    pbr(leather, { color: 0x2c1a14 }),
  steel:   pbr(metal, { metalness: 1, roughness: 1, envMapIntensity: 1.0 }),
  brass:   pbr(brass, { metalness: 0.9, envMapIntensity: 1.0 }),
  ember:   new THREE.MeshStandardMaterial({ color: 0xff6a22, emissive: 0xff4a0c, emissiveIntensity: 2.4, roughness: 0.35 }),
};

/* ============================================================
   5. Lumières
   ============================================================ */
scene.add(new THREE.HemisphereLight(0x3a4c86, 0x140a1c, 0.25));
const key = new THREE.DirectionalLight(0xffb36b, 3.0);   // clé chaude
key.position.set(4.2, 4.6, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -2.5, right: 2.5, top: 3, bottom: -1, near: 1, far: 16 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6e96ff, 3.0);  // contre-jour froid
rim.position.set(-3.2, 2.8, -4.8);
scene.add(rim);

/* ============================================================
   6. Géométrie organique : solides de révolution déformés
   ============================================================ */
// Profil r(s) : s = 0 en haut du membre, 1 en bas ; interpolation cosinus
function prof(ctrl) {
  return (s) => {
    if (s <= ctrl[0][0]) return ctrl[0][1];
    for (let i = 0; i < ctrl.length - 1; i++) {
      const [s0, r0] = ctrl[i], [s1, r1] = ctrl[i + 1];
      if (s <= s1) {
        const k = (s - s0) / (s1 - s0);
        return r0 + (r1 - r0) * (0.5 - 0.5 * Math.cos(Math.PI * k));
      }
    }
    return ctrl[ctrl.length - 1][1];
  };
}
// Solide de révolution le long de -Y (pivot en haut) : bruit de surface, plis verticaux, déformation
function organic(profile, len, o = {}) {
  const { seg = 40, rows = 28, fold = 0, foldN = 6, noise = 0.012, seed = 0, warp = null } = o;
  const pts = [];
  for (let i = 0; i <= rows; i++) {
    const t = i / rows; // 0 = bas, 1 = haut
    pts.push(new THREE.Vector2(Math.max(profile(1 - t), 0.0005), -len * (1 - t)));
  }
  const g = new THREE.LatheGeometry(pts, seg);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const a = Math.atan2(v.z, v.x), r = Math.hypot(v.x, v.z), s = -v.y / len;
    const wob = Math.sin(a * 3 + s * 9 + seed) * 0.5 + Math.sin(a * 7 - s * 17 + seed * 2) * 0.3 + Math.sin(a * 13 + s * 31 + seed * 3) * 0.2;
    const f = 1 + fold * Math.sin(a * foldN + seed) * (0.6 + 0.4 * Math.sin(s * 5 + seed)) + noise * wob;
    v.set(Math.cos(a) * r * f, v.y, Math.sin(a) * r * f);
    if (warp) warp(v, s);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  // couture du lathe : colonnes 0 et seg partagent la position, on moyenne leurs normales
  const n = g.attributes.normal, P = pts.length;
  for (let j = 0; j < P; j++) {
    const a = j, b = seg * P + j;
    const nx = n.getX(a) + n.getX(b), ny = n.getY(a) + n.getY(b), nz = n.getZ(a) + n.getZ(b);
    const l = Math.hypot(nx, ny, nz) || 1;
    n.setXYZ(a, nx / l, ny / l, nz / l);
    n.setXYZ(b, nx / l, ny / l, nz / l);
  }
  return g;
}
// Ellipsoïde organique centrée sur l'origine (épaulière, articulation, gant)
function blobGeo(r, seed, noise = 0.03) {
  const g = organic((s) => r * Math.sin(Math.PI * s), 2 * r, { seg: 32, rows: 24, noise, seed });
  g.translate(0, r, 0);
  return g;
}
// Ajoute un mesh : géométrie + matériau + transform
function add(parent, geo, mat, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1, cast = true } = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.scale.set(sx, sy, sz);
  m.castShadow = cast;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
// Hélice pour l'enroulement de cuir de la poignée
class Helix extends THREE.Curve {
  constructor(r, h, turns) { super(); this.r = r; this.h = h; this.turns = turns; }
  getPoint(t, target = new THREE.Vector3()) {
    const a = t * Math.PI * 2 * this.turns;
    return target.set(Math.cos(a) * this.r, t * this.h - this.h / 2, Math.sin(a) * this.r);
  }
}

/* ============================================================
   7. Sol : pierre humide + réflexion plane (Reflector)
   ============================================================ */
stone.map.repeat.set(8, 8);
stone.nrm.repeat.set(8, 8);
stone.rough.repeat.set(8, 8);
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(14, 128),
  new THREE.MeshStandardMaterial({
    map: stone.map, normalMap: stone.nrm, normalScale: new THREE.Vector2(1, 1),
    roughnessMap: stone.rough, roughness: 1, metalness: 0, color: 0xb8b2aa, envMapIntensity: 0.35,
  })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

let floorRefl = null;
if (on('reflect')) {
  // Réflexion additive par-dessus le sol : n'est visible que sur les flaques (rugosité basse)
  floorRefl = new Reflector(new THREE.CircleGeometry(14, 128), {
    textureWidth: 512, textureHeight: 512, clipBias: 0.003,
    shader: {
      name: 'WetStone',
      uniforms: {
        color: { value: null },
        tDiffuse: { value: null },
        textureMatrix: { value: null },
        tNormal: { value: stone.nrm },
        tRough: { value: stone.rough },
        uRepeat: { value: 8 },
        uStrength: { value: 0.7 },
      },
      vertexShader: `
        uniform mat4 textureMatrix;
        varying vec2 vUv;
        varying vec4 vUvR;
        varying vec3 vW;
        void main() {
          vUv = uv;
          vUvR = textureMatrix * vec4(position, 1.0);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vW = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform sampler2D tNormal;
        uniform sampler2D tRough;
        uniform float uRepeat;
        uniform float uStrength;
        varying vec2 vUv;
        varying vec4 vUvR;
        varying vec3 vW;
        void main() {
          vec2 uv = vUv * uRepeat;
          vec3 n = texture2D(tNormal, uv).xyz * 2.0 - 1.0;
          float rough = texture2D(tRough, uv).g;
          float wet = smoothstep(0.85, 0.3, rough);
          vec4 pr = vUvR;
          pr.xy += n.xy * 0.04 * (0.3 + 0.7 * wet) * pr.w;
          vec3 refl = texture2DProj(tDiffuse, pr).rgb;
          vec3 V = normalize(cameraPosition - vW);
          float fres = 0.04 + 0.96 * pow(1.0 - max(V.y, 0.0), 5.0);
          float k = uStrength * wet * (0.15 + 0.85 * fres);
          gl_FragColor = vec4(refl * vec3(0.9, 1.0, 0.95) * k, 1.0);
        }`,
    },
  });
  floorRefl.rotation.x = -Math.PI / 2;
  floorRefl.position.y = 0.002;
  Object.assign(floorRefl.material, { transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  scene.add(floorRefl);
}

/* ============================================================
   8. Personnage (hero) — origine aux pieds, face à +Z
   ============================================================ */
const hero = new THREE.Group();
hero.scale.setScalar(0.86);
scene.add(hero);
const bob = new THREE.Group(); // respiration / rebond d'idle
hero.add(bob);

const hips = new THREE.Group();
hips.position.y = 0.92;
bob.add(hips);
// Bassin
add(hips, organic(prof([[0, 0.1], [0.2, 0.165], [0.6, 0.17], [0.9, 0.13], [1, 0.1]]), 0.3,
  { fold: 0.01, foldN: 4, noise: 0.012, seed: 2, warp: (v) => { v.x *= 1.08; v.z *= 0.8; } }).translate(0, 0.15, 0), M.coatLo);

// Jambes : cuisse, genou articulé, tibia avec mollet, botte et pied
function leg(side) {

    // onde qui part des épaules et descend : phase = t·vitesse − v·k
    const wave = Math.sin(t * 2.6 - v * 6.0) * 0.06 * Math.pow(v, 1.4);

    p.setXYZ(i, bx + sway + fold, by, -0.3 * Math.pow(v, 1.3) + wave);

/* ============================================================
   10. Flamme : coques en shader de bruit animé, additives
   ============================================================ */
const TIME = { value: 0 };
const FLAME_H = 0.62;
const flameVS = `
  uniform float uTime; uniform float uAmp; uniform float uPhase; uniform float uH;
  varying float vH; varying vec3 vLocal; varying vec3 vN; varying vec3 vW;
  void main() {
    vec3 p = position;
    float h = clamp(p.y / uH, 0.0, 1.0);
    float a = atan(p.z, p.x);
    float w = sin(uTime * 4.3 + p.y * 12.0 + a * 2.0 + uPhase) * 0.5 + sin(uTime * 7.1 - p.y * 8.0 + a * 3.0 + uPhase * 1.7) * 0.5;
    float k = 1.0 + h * uAmp * w;
    p.xz *= k;
    p.y += h * 0.03 * sin(uTime * 5.2 + a * 2.0 + uPhase);
    vH = h;
    vLocal = p;
    vN = normalize(normalMatrix * normal);
    vec4 wp = modelMatrix * vec4(p, 1.0);
    vW = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;
const flameFS = `
  uniform float uTime; uniform vec3 uColA; uniform vec3 uColB; uniform float uOpacity;
  uniform float uScale; uniform float uSpeed; uniform float uSeed;
  varying float vH; varying vec3 vLocal; varying vec3 vN; varying vec3 vW;
  float h3(vec3 p) { p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float n3(vec3 x) {
    vec3 i = floor(x), f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    float a = mix(mix(h3(i), h3(i + vec3(1, 0, 0)), f.x), mix(h3(i + vec3(0, 1, 0)), h3(i + vec3(1, 1, 0)), f.x), f.y);
    float b = mix(mix(h3(i + vec3(0, 0, 1)), h3(i + vec3(1, 0, 1)), f.x), mix(h3(i + vec3(0, 1, 1)), h3(i + vec3(1, 1, 1)), f.x), f.y);
    return mix(a, b, f.z);
  }
  float fbm3(vec3 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * n3(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
  void main() {
    // le bruit remonte : la flamme s'étire vers le haut
    vec3 q = vec3(vLocal.x, vLocal.y * 0.6 - uTime * uSpeed, vLocal.z) * uScale + uSeed;
    float n = fbm3(q);
    float body = smoothstep(0.25, 0.85, n + 0.35 - vH * 0.55);
    float edge = pow(1.0 - abs(dot(normalize(vN), normalize(cameraPosition - vW))), 1.5);
    float a = body * uOpacity * (0.35 + 0.65 * edge) * (1.0 - vH * 0.5);
    vec3 col = mix(uColA, uColB, clamp(body * 1.2 - vH * 0.3 + 0.1, 0.0, 1.0));
    gl_FragColor = vec4(col, a);
  }`;
function flameMaterial({ colA, colB, opacity, scale, speed, amp, phase, seed, H = FLAME_H }) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: TIME, uColA: { value: new THREE.Color(...colA) }, uColB: { value: new THREE.Color(...colB) },
      uOpacity: { value: opacity }, uScale: { value: scale }, uSpeed: { value: speed },
      uSeed: { value: seed }, uAmp: { value: amp }, uPhase: { value: phase }, uH: { value: H },
    },
    vertexShader: flameVS, fragmentShader: flameFS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
}

    emberPos[i * 3 + 1] += (0.25 + emberSpd[i] * 0.35) * dt;
    emberPos[i * 3 + 2] += Math.cos(t * 1.3 + emberPh[i]) * 0.06 * dt;

/* ============================================================
   13. Post-traitement : AO géométrique (GTAO), bloom, sortie ACES
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// Passe AO : ne voit que l'opaque (sprites, braises, flamme et réflexion masqués pendant son passage)
function opaqueOnly(pass) {
  const render = pass.render.bind(pass);
  pass.render = (...args) => {
    const hidden = [];
    scene.traverse((o) => {
      if (o.visible && (o.isMesh || o.isPoints || o.isSprite) && o.material.transparent) {
        hidden.push(o);
        o.visible = false;
      }
    });
    render(...args);
    for (const o of hidden) o.visible = true;
  };
  return pass;
}
if (on('ao')) {
  const gtao = new GTAOPass(scene, camera, window.innerWidth, window.innerHeight);
  gtao.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.5, thickness: 1.2, scale: 1.0, samples: 16 });
  gtao.blendIntensity = 1.0;
  composer.addPass(opaqueOnly(gtao));
}
composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.4, 0.82));
composer.addPass(new OutputPass());

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 46 : 32; // plus de recul sur mobile en portrait
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
setView(new URLSearchParams(location.search).get('view') || 'three', true);

/* ============================================================
   14. Boucle
   ============================================================ */
const t0 = performance.now();
let last = t0;
const fogBase = new THREE.Vector3();
function frame(now) {
  const t = (now - t0) / 1000;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  TIME.value = t;

  // Idle : respiration, rebond, flamme qui oscille
  bob.position.y = Math.sin(t * 1.7) * 0.012;
  chest.rotation.x = 0.34 + Math.sin(t * 1.7 + 0.6) * 0.025;
  flame.rotation.z = Math.sin(t * 1.3) * 0.04;
  flame.rotation.x = Math.sin(t * 0.9) * 0.03;
  for (const tg of flame.children) {
    if (tg.userData.a !== undefined) tg.rotation.z = -Math.cos(tg.userData.a) * 0.35 + Math.sin(t * 3.1 + tg.userData.a) * 0.12;
  }
  // Lumière de flamme : vacillement non périodique (somme de sinus)
  flameLight.intensity = 0.18 * (1 +0.1 * Math.sin(t * 17) + 0.12 * Math.sin(t * 6.3) + 0.05 * Math.sin(t * 31));
  glow.material.opacity = 0.5 + Math.sin(t * 9) * 0.06;
  animateCape(t);
  animateScarf(t);

  if (embers.visible) updateEmbers(dt, t);
  for (const f of fogSprites) {
    const a = f.a + t * 0.012;
    f.s.position.set(Math.cos(a) * 6.5, f.y + Math.sin(t * 0.2 + f.ph) * 0.08, Math.sin(a) * 6.5);
  }

  // Transition douce entre les vues (interpolation sphérique)
  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 0.9);
    const e = tween.k < 0.5 ? 4 * tween.k ** 3 : 1 - (-2 * tween.k + 2) ** 3 / 2;
    const s = new THREE.Spherical(
      THREE.MathUtils.lerp(tween.from.radius, tween.dest.radius, e),
      THREE.MathUtils.lerp(tween.from.phi, tween.dest.phi, e),
      THREE.MathUtils.lerp(tween.from.theta, tween.dest.theta, e),
    );
    camera.position.setFromSpherical(s).add(TARGET);
    if (tween.k >= 1) tween = null;
  }

  controls.update();
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
